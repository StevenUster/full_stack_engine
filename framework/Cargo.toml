[package]
name = "full_stack_engine"
version = "9.0.0"
edition = "2024"
description = "A lightweight, opinionated Rust web framework built on top of Actix-web, SQLx, and Tera."
license = "MIT OR Apache-2.0"
repository = "https://github.com/StevenUster/full_stack_engine"
readme = "README.md"
keywords = ["web", "framework", "actix-web", "sqlx", "tera"]
categories = ["web-programming"]
# The proc-macro crate is a separate nested package, not part of this one.
exclude = ["macros/"]

[lib]
name = "full_stack_engine"
path = "src/lib.rs"

[dependencies]
# The fse ORM ships with the framework: schema-driven migrations plus
# compile-time-checked queries (see the prelude re-exports).
fse-orm = { version = "0.4.0", path = "../fse-orm/runtime" }
# The model registry: derive(Model) re-parses structs with fse-schema and
# registers them via inventory for boot-time route generation.
full_stack_engine_macros = { version = "0.1.0", path = "macros" }
fse-schema = { version = "0.4.0", path = "../fse-orm/schema" }
inventory = "0.3"
actix-web = "4.12.1"
actix-files = "0.6.9"
# `governor` directly, not `actix-governor`: that wrapper is GPL-3.0-or-later,
# which would make every binary built on this MIT/Apache-2.0 framework a GPLv3
# derivative. The algorithm is in `governor` (MIT); the Actix middleware around
# it lives in `src/rate_limiter.rs`.
governor = "0.10.4"
tokio-cron-scheduler = { version = "0.15.1", features = ["signal"] }
tera = "1.20.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# ── Observability ────────────────────────────────────────────────────────────
# `tracing` replaces `env_logger` as the front end: spans give every log line
# the request it belongs to, and the same events can feed an OTLP exporter
# without a second instrumentation pass.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Actix's own middleware mechanism, not Tower: `TracingLogger` opens one root
# span per request and keeps it entered across the whole response body.
# `default-features = false` drops `emit_event_on_error`, whose `{:?}` dump of
# every failed request would both double-log and risk leaking query details —
# `observability::FseRootSpan` reports failures itself, with the error's full
# source chain and nothing else.
tracing-actix-web = { version = "0.7.22", default-features = false }
# Snapshot tests: the rendered HTML of every theme page is checked against a
# committed snapshot, so a template or context change that silently alters a
# page shows up as a reviewable diff.
insta = "1.48.0"
# Optional (`otel` feature): OTLP export over HTTP/protobuf. Deliberately not
# `grpc-tonic`, which would pull tonic and therefore Tower into an Actix app;
# the HTTP transport reuses the `reqwest` already in this dependency tree.
opentelemetry = { version = "0.32", default-features = false, features = [
    "trace",
], optional = true }
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
    "trace",
], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
], optional = true }
tracing-opentelemetry = { version = "0.33", default-features = false, optional = true }
# Optional (`sentry` feature): error/panic reporting to any Sentry-protocol
# backend (Sentry, GlitchTip, self-hosted). Wired in as a `tracing` layer, so
# no application code ever calls the vendor's API.
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "tracing",
    "reqwest",
    "native-tls",
], optional = true }
sqlx = { version = "0.8.6", default-features = false, features = [
    "sqlite",
    "chrono",
    "runtime-tokio",
    "macros",
    "migrate",
    # `tls-none`, not `tls-native-tls`: SQLite is a local file, so sqlx never
    # opens a TLS connection. This is what lets the runtime image drop
    # OpenSSL — see `lettre` below and the starter's Dockerfile.
    "tls-none",
] }
# `dotenvy`, not `dotenv`: the original has been unmaintained for years and
# `cargo deny` flags it. Drop-in replacement.
dotenvy = "0.15.7"
include_dir = "0.7.4"
mime_guess = "2.0.5"
# `log` stays a dependency even though the framework emits `tracing`: sqlx,
# actix-web, lettre and reqwest all record through the `log` facade, and
# `tracing-subscriber`'s `tracing-log` bridge funnels those records into the
# same subscriber. Apps written against the old `log::info!` prelude exports
# keep working unchanged.
log = "0.4.29"
rust-argon2 = "3.0.0"
rand = "0.9.2"
# `aws_lc_rs` rather than `rust_crypto`. The framework signs with HS256 only,
# but `rust_crypto` pulls `rsa`, which carries an unfixable timing-sidechannel
# advisory (RUSTSEC-2023-0071, the Marvin attack) for code paths this app never
# executes. aws-lc-rs provides the HMAC and is already in the tree via rustls,
# so this removes a dependency rather than adding one.
jsonwebtoken = { version = "10.3.0", default-features = false, features = [
    "aws_lc_rs",
] }
thiserror = "2.0.18"
futures = "0.3.31"
chrono = { version = "0.4.43", features = ["serde"] }
reqwest = { version = "0.13.1", features = ["json"] }
# rustls rather than native-tls, with the webpki root store bundled in: no
# system OpenSSL, and no dependency on the image's CA bundle being present.
lettre = { version = "0.11.22", default-features = false, features = [
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "builder",
    "hostname",
] }
actix-multipart = "0.7.2"
uuid = { version = "1.23.3", features = ["v4"] }
# Secrets are `SecretString`, not `String`: no `Debug`/`Display`, so a secret
# cannot reach a log line or a telemetry backend by accident. Reading one is an
# explicit `.expose_secret()` that shows up in review.
secrecy = "0.10.3"
# Caches the per-request session-revocation lookup, which was a database
# round-trip on every authenticated request.
moka = { version = "0.12.16", features = ["sync"] }
# Declarative request validation, re-exported from the prelude. Replaces
# hand-rolled `email.contains('@')` checks with a real parser.
validator = { version = "0.21.0", features = ["derive"] }

[features]
default = []
# Export spans to any OTLP-compatible backend (collector, Tempo, Jaeger,
# Honeycomb, ...). Configured entirely through the standard `OTEL_*`
# environment variables — see `observability::Settings`.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# Report ERROR-level events and panics to a Sentry-compatible backend.
sentry = ["dep:sentry"]

[build-dependencies]
# The build script creates the integration tests' scratch database from the
# #[model] structs in tests/ (see build.rs).
fse-schema = { version = "0.4.0", path = "../fse-orm/schema" }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
# Integration tests are separate crates, so shared deps are repeated here.
actix-multipart = "0.7.2"
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
serde_json = "1.0"
include_dir = "0.7.4"
# `tests/observability_http.rs` mounts the real `TracingLogger` and captures
# the spans it produces with a throwaway subscriber.
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-actix-web = { version = "0.7.22", default-features = false }
# Snapshot tests: the rendered HTML of every theme page is checked against a
# committed snapshot, so a template or context change that silently alters a
# page shows up as a reviewable diff.
insta = "1.48.0"
