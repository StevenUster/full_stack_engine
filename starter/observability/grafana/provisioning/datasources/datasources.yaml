apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: false
    jsonData:
      # Jump from a trace to the request-rate/latency series of its route,
      # and draw the service graph from the generated metrics.
      tracesToMetrics:
        datasourceUid: prometheus
        tags: [{ key: service.name, value: service }]
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: 1h
        spanEndTimeShift: -1h

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      # How often Tempo's metrics generator writes a sample. Grafana sizes
      # `$__rate_interval` from it; too small, and a counter's single 0 -> 1
      # step can fall between two windows and show as nothing.
      timeInterval: 15s
      # A latency spike on a graph links to an example trace that caused it.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
