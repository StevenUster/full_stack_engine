stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# How long traces are kept (Tempo 3 moved compaction and retention from the
# old `compactor` block to the backend worker).
backend_worker:
  compaction:
    block_retention: ${TRACE_RETENTION:-336h}

# Request rate, error rate and latency per route, computed from the spans and
# written to Prometheus — the app exports no metrics of its own, and needs to.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]
