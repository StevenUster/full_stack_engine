# fse configuration. Every key is optional and defaults to this layout;
# the file exists mainly to declare the framework's schema contract below
# and to pick the active theme.

# Themes: every folder of themes/ is one theme, embedded in the binary by
# `full_stack_engine::themes!()`. A theme may extend another theme folder or
# an installed theme crate (`"parent"` in its theme.json).
[themes]
# The active theme, by its theme.json name. `THEME=...` overrides it at boot.
active = "starter"
# dir = "themes"
# dev_server = "http://localhost:4321"   # where `cargo run --bin dev` runs the active theme

[orm]
tables_dir = "src/models"
migrations_dir = "migrations"
snapshot_path = ".fse/schema.json"
database_url_env = "DATABASE_URL"

# Columns the framework's auth layer and auth module query at runtime.
# `fse migrate` refuses to generate a schema that breaks this contract —
# add columns to `users` freely, but keep these.
[orm.required_columns]
users = [
    "id",
    "email",
    "password",
    "role",
    "first_name",
    "last_name",
    "is_verified",
    "verification_token",
    "verification_token_expires_at",
    "reset_token",
    "reset_token_expires_at",
    "pending_email",
    "email_change_token",
    "email_change_token_expires_at",
    "sessions_valid_after",
    "created_at",
]
