name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SQLX_OFFLINE: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build themes
        # `cargo build`/`test` embed every theme's dist/ via `themes!()`, so
        # each must be built (and up to date) before the Rust step runs.
        # Installs first: a child theme builds from its sibling parent's sources.
        run: |
          set -e
          for t in themes/*/; do if [ -f "$t/package.json" ]; then (cd "$t" && bun install --frozen-lockfile); fi; done
          for t in themes/*/; do if [ -f "$t/package.json" ]; then (cd "$t" && bun run build); fi; done

      - name: Set up Rust
        # Pinned to match the Rust version the Dockerfile builds with.
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Run cargo test
        run: cargo test --verbose
