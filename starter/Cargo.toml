[package]
name = "starter"
version = "0.1.0"
edition = "2024"
# A template to copy, not a crate to publish.
publish = false

[dependencies]
# `otel` exports spans over OTLP when OTEL_EXPORTER_OTLP_ENDPOINT is set; add
# "sentry" for error reporting. Everything else comes from the prelude.
full_stack_engine = { version = "11.2.0", path = "../framework", features = ["otel"] }
# The default theme; the app's theme in themes/starter extends it.
fse-theme-default = { version = "0.4.0", path = "../fse-theme-default" }

# Needed only because these crates' macros expand to absolute `::crate::` paths:
# actix-web's #[get], serde's derive, fse-orm's queries, sqlx::migrate!.
# Features come from the framework, so no feature lists here.
actix-web = "4"
serde = { version = "1", features = ["derive"] }
fse-orm = { version = "0.4.0", path = "../fse-orm/runtime" }
sqlx = { version = "0.8", default-features = false }

[dev-dependencies]
# Page snapshots; `cargo insta review` accepts an intended change.
insta = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
