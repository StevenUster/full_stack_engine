# Supply-chain gate for every crate in this repository.
#
#   cargo install cargo-deny
#   cargo deny --manifest-path framework/Cargo.toml check
#   cargo deny --manifest-path starter/Cargo.toml   check
#
# Security is the first of this project's stated priorities, and a dependency
# tree is the largest piece of the codebase nobody reads. This makes three
# things fail loudly instead of silently: a known vulnerability, a licence the
# project cannot ship, and a yanked crate still pinned in a lockfile.

[advisories]
# A crate with a filed advisory fails the check. Add an exception here with the
# advisory id and a comment saying why it does not apply, never by widening this.
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # h2 0.3 accepts unbounded empty DATA frames (a remote DoS). Not fixable
    # here: it comes from actix-http 3.x, which depends on `h2 ^0.3`, and the
    # fix is in 0.4.16. Drops out when actix-web moves to h2 0.4.
    #
    # Mitigation in the meantime: actix-web only negotiates HTTP/2 over TLS
    # (h2c is opt-in and not enabled), and these apps serve plain HTTP behind a
    # TLS-terminating proxy — so the h2 code path is never entered. Re-check
    # this reasoning if an app ever binds TLS directly.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3 reached only via actix-http; HTTP/2 is never negotiated behind the proxy" },
]

[licenses]
# Permissive licences only. The framework ships as `MIT OR Apache-2.0`, and a
# copyleft dependency would change what downstream apps may do with their own
# binaries — which is not a decision a transitive dependency gets to make.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",              # quoted_printable, via lettre
    # webpki-roots / webpki-root-certs — the bundled Mozilla CA set. A data
    # licence, permissive, and what lets the runtime image ship without relying
    # on the system trust store for SMTP.
    "CDLA-Permissive-2.0",
    "MIT-0",             # aws-lc-sys, via rustls's aws-lc-rs provider
]
confidence-threshold = 0.9

# The starter and the apps built from it are `publish = false` — templates and
# deployments, not crates to ship — so they need no licence of their own.
[licenses.private]
ignore = true

# No exceptions. The one that used to live here — `actix-governor`, which is
# GPL-3.0-or-later and would have made every binary built on this MIT/Apache-2.0
# framework a GPLv3 derivative — is gone: `src/rate_limiter.rs` is now Actix
# middleware written directly over `governor` (MIT). If a GPL crate reappears,
# this check is what will say so.

[bans]
# Several versions of the same crate bloat the binary and, for TLS and crypto,
# mean two implementations with two sets of bugs. A warning rather than an error
# because the Rust ecosystem's mid-version-bump periods make this unavoidable.
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # `tonic` is the marker for the gRPC OTLP exporter, which would put a whole
    # second service stack (Tower) into the request path. The observability
    # stack uses OTLP over HTTP/protobuf instead — see framework/Cargo.toml.
    #
    # `tower` itself is deliberately *not* banned: reqwest 0.13 uses it
    # internally for its own client middleware, which is unrelated to how this
    # framework handles HTTP requests. The rule being enforced is "app
    # middleware is Actix's", not "the word tower never appears in the tree".
    { name = "tonic", reason = "pulls a second service stack; use opentelemetry-otlp's http-proto transport" },
    # TLS is rustls throughout, which is what keeps OpenSSL out of the runtime
    # image (see starter/Dockerfile).
    { name = "openssl", reason = "rustls only; keeps OpenSSL out of the runtime image" },
    { name = "native-tls", reason = "rustls only; keeps OpenSSL out of the runtime image" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Only crates.io. A git dependency cannot be audited by version and cannot be
# published, so it must never reach a released crate.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
