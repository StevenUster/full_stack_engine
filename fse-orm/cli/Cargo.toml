[package]
name = "fse-cli"
description = "The fse binary for full_stack_engine apps: scaffolds new apps, generates and applies sqlx migrations from #[model] structs, refreshes the offline query cache, and prints the routes and the agent guide."
# Independent of workspace.package.version.
version = "0.7.2"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "fse_cli"
path = "src/lib.rs"

[[bin]]
name = "fse"
path = "src/main.rs"

[dependencies]
color-eyre = { version = "0.6", default-features = false, features = ["track-caller"] }
fse-schema = { version = "0.4.0", path = "../schema" }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dotenvy = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
